# ══════════════════════════════════════════════════════════════════
#  VOLUMES
# ══════════════════════════════════════════════════════════════════

volumes:
  rabbitmq-1-data:
  rabbitmq-2-data:
  rabbitmq-3-data:
  gateway-db-data:
  validator1-db-data:
  validator2-db-data:
  validator3-db-data:

# ══════════════════════════════════════════════════════════════════
#  NETWORKS
# ══════════════════════════════════════════════════════════════════
#
# A single user-defined bridge network connects all containers.
# Service names resolve as DNS hostnames, so containers reach each
# other by name (e.g. rabbitmq-1, gateway-db, validator1-app).

networks:
  blockchain-net:
    driver: bridge
