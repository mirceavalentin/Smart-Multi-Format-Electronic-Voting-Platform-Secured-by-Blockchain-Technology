# podman-compose.yml  (compatible with docker-compose v3.8 syntax)
#
# 4-Node Voting Network + 3-Node RabbitMQ HA Cluster
# ===================================================
#
# WHY 3 RABBITMQ NODES?
# ─────────────────────
# RabbitMQ achieves high availability through a quorum queue cluster.
# A 3-node cluster can tolerate one node failure and still maintain a
# majority (2/3 nodes), keeping the broker operational throughout the
# thesis demo. This replaces the fragile custom WebSocket P2P layer.
#
# HOW THE CLUSTER WORKS
# ─────────────────────
# All three nodes share the same RABBITMQ_ERLANG_COOKIE (a shared secret
# that proves they belong to the same cluster). Nodes 2 and 3 wait for
# node 1 to become healthy, then join the cluster via rabbitmqctl.
#
# APPLICATION TOPOLOGY
# ────────────────────
#   Gateway (Node A)   — exposes REST API + web UI on port 3000.
#   Validators 1–3     — mine blocks, no external HTTP access.
#   Each app container connects to rabbitmq-1:5672 (cluster member).
#
# USAGE
# ─────
#   podman-compose up --build        # build images and start all containers
#   podman-compose down -v           # stop containers and wipe all volumes
#   podman-compose logs -f           # stream logs from all containers
#   podman-compose logs -f gateway-app  # stream one container's logs

version: "3.8"

# ══════════════════════════════════════════════════════════════════
#  RABBITMQ CLUSTER (3 nodes for HA quorum)
# ══════════════════════════════════════════════════════════════════

services:

  # ── RabbitMQ Node 1 — primary (stats + management UI) ──────────
  rabbitmq-1:
    image: rabbitmq:3.12-management
    container_name: rabbitmq-1
    hostname: rabbitmq-1
    restart: unless-stopped
    environment:
      RABBITMQ_ERLANG_COOKIE: "VOTING_PLATFORM_ERLANG_COOKIE"
      RABBITMQ_DEFAULT_USER:  "admin"
      RABBITMQ_DEFAULT_PASS:  "admin"
    healthcheck:
      # `rabbitmq-diagnostics ping` returns 0 only when the broker is
      # fully initialised and accepting AMQP connections.
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout:  10s
      retries:  15
      start_period: 30s
    ports:
      - "5672:5672"    # AMQP — used by app containers
      - "15672:15672"  # Management UI — open http://localhost:15672 in browser
    volumes:
      - rabbitmq-1-data:/var/lib/rabbitmq
    networks:
      - blockchain-net

  # ── RabbitMQ Node 2 — joins the cluster once node 1 is healthy ─
  rabbitmq-2:
    image: rabbitmq:3.12-management
    container_name: rabbitmq-2
    hostname: rabbitmq-2
    restart: unless-stopped
    depends_on:
      rabbitmq-1:
        condition: service_healthy
    environment:
      RABBITMQ_ERLANG_COOKIE: "VOTING_PLATFORM_ERLANG_COOKIE"
    # The entrypoint starts the broker, waits until it is ready to accept
    # rabbitmqctl commands, then joins the cluster hosted on rabbitmq-1.
    entrypoint: sh
    command:
      - -c
      - |
        rabbitmq-server &
        RMQPID=$$!
        until rabbitmqctl status > /dev/null 2>&1; do sleep 2; done
        rabbitmqctl stop_app
        rabbitmqctl reset
        rabbitmqctl join_cluster rabbit@rabbitmq-1
        rabbitmqctl start_app
        wait $$RMQPID
    volumes:
      - rabbitmq-2-data:/var/lib/rabbitmq
    networks:
      - blockchain-net

  # ── RabbitMQ Node 3 — joins the cluster once node 1 is healthy ─
  rabbitmq-3:
    image: rabbitmq:3.12-management
    container_name: rabbitmq-3
    hostname: rabbitmq-3
    restart: unless-stopped
    depends_on:
      rabbitmq-1:
        condition: service_healthy
    environment:
      RABBITMQ_ERLANG_COOKIE: "VOTING_PLATFORM_ERLANG_COOKIE"
    entrypoint: sh
    command:
      - -c
      - |
        rabbitmq-server &
        RMQPID=$$!
        until rabbitmqctl status > /dev/null 2>&1; do sleep 2; done
        rabbitmqctl stop_app
        rabbitmqctl reset
        rabbitmqctl join_cluster rabbit@rabbitmq-1
        rabbitmqctl start_app
        wait $$RMQPID
    volumes:
      - rabbitmq-3-data:/var/lib/rabbitmq
    networks:
      - blockchain-net

# ══════════════════════════════════════════════════════════════════
#  GATEWAY (Node A)
# ══════════════════════════════════════════════════════════════════

  gateway-db:
    image: docker.io/library/mongo:7
    container_name: gateway-db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout:  5s
      retries:  10
      start_period: 10s
    volumes:
      - gateway-db-data:/data/db
    networks:
      - blockchain-net

  gateway-app:
    build:
      context:    .
      dockerfile: Dockerfile
    container_name: gateway-app
    restart: unless-stopped
    depends_on:
      gateway-db:
        condition: service_healthy
      rabbitmq-1:
        condition: service_healthy
    environment:
      NODE_NAME:             "gateway"
      IS_VALIDATOR:          "false"
      HTTP_PORT:             "3000"
      MONGO_URI:             "mongodb://gateway-db:27017/voting_node_db"
      RABBITMQ_URL:          "amqp://admin:admin@rabbitmq-1:5672"
      VALIDATOR_INTERVAL_MS: "15000"
    ports:
      - "3000:3000"   # REST API + web UI — exposed to host (gateway only)
    networks:
      - blockchain-net

# ══════════════════════════════════════════════════════════════════
#  VALIDATOR 1 (Node B)
# ══════════════════════════════════════════════════════════════════

  validator1-db:
    image: docker.io/library/mongo:7
    container_name: validator1-db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout:  5s
      retries:  10
      start_period: 10s
    volumes:
      - validator1-db-data:/data/db
    networks:
      - blockchain-net

  validator1-app:
    build:
      context:    .
      dockerfile: Dockerfile
    container_name: validator1-app
    restart: unless-stopped
    depends_on:
      validator1-db:
        condition: service_healthy
      rabbitmq-1:
        condition: service_healthy
    environment:
      NODE_NAME:             "validator-1"
      IS_VALIDATOR:          "true"
      HTTP_PORT:             "3000"
      MONGO_URI:             "mongodb://validator1-db:27017/voting_node_db"
      RABBITMQ_URL:          "amqp://admin:admin@rabbitmq-1:5672"
      VALIDATOR_INTERVAL_MS: "15000"
    # Port 3000 NOT exposed — validators do not serve external traffic.
    networks:
      - blockchain-net

# ══════════════════════════════════════════════════════════════════
#  VALIDATOR 2 (Node C)
# ══════════════════════════════════════════════════════════════════

  validator2-db:
